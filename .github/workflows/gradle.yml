name: Build TenorClef

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-primary:
    name: Build Fabric 1.21.1
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build primary module
        run: ./gradlew :1.21.1:build
      - name: Upload primary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tenorclef-1.21.1
          path: versions/1.21.1/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
