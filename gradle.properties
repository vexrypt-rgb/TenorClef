# Gradle performance improvements
# Keep heap modest for CI runners (~7GB). For heavy local preprocess/full builds,
# override in ~/.gradle/gradle.properties or gradle.properties.local, e.g.:
#   org.gradle.jvmargs=-Xmx8192M
org.gradle.jvmargs=-Xmx2G
org.gradle.vfs.watch=true
kapt.use.worker.api=true
kapt.include.compile.classpath=false
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.warning.mode=all

loader_version=0.16.7
# Mod Properties
mod_version=0.19
maven_group=gaucho-matrero.altoclef
archives_base_name=altoclef

# Do NOT set org.gradle.java.home here (breaks Linux CI / other machines).
# Use JAVA_HOME, a JDK 21 toolchain, ~/.gradle/gradle.properties, or the
# optional gitignored gradle.properties.local (see docs/DEVELOPMENT.md).
