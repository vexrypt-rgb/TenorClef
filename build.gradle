import com.replaymod.gradle.preprocess.PreprocessTask

buildscript {
    def (major, minor, patch) = project.name.split("-")[0].tokenize('.')
    project.ext.mcVersion = "${major}${minor.padLeft(2, '0')}${(patch ?: '').padLeft(2, '0')}" as int

    dependencies {
        classpath 'fabric-loom:fabric-loom.gradle.plugin:1.15.5'
    }
}


plugins {
    id "maven-publish"
    id 'com.gradleup.shadow' version '9.4.0'
    id 'xyz.wagyourtail.jvmdowngrader' version '1.2.2'
}

apply plugin: 'fabric-loom'
apply plugin: 'com.replaymod.preprocess'

preprocess {
    patternAnnotation.set("adris.altoclef.multiversion.Pattern")
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}



tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

base {
    archivesName = project.archives_base_name
}
version = "${project.name}-${project.mod_version}"
group = project.maven_group

def mappingsVersions = [
        11601: "1.16.1+build.21",
        11605: "1.16.5+build.10",
        11701: "1.17.1+build.65",
        11800: "1.18+build.1",
        11802: "1.18.2+build.4",
        11904: "1.19.4+build.2",
        12001: "1.20.1+build.10",
        12002: "1.20.2+build.4",
        12004: "1.20.4+build.3",
        12005: "1.20.5+build.1",
        12006: "1.20.6+build.3",
        12100: "1.21+build.9",
        12101: "1.21.1+build.3",
        12111: "1.21.11+build.3",
]

def fabricApiVersions = [
        11601: "0.18.0+build.387-1.16.1",
        11605: "0.42.0+1.16",
        11701: "0.46.1+1.17",
        11800: "0.44.0+1.18",
        11802: "0.77.0+1.18.2",
        11904: "0.87.2+1.19.4",
        12001: "0.92.2+1.20.1",
        12002: "0.91.2+1.20.2",
        12004: "0.96.3+1.20.4",
        12005: "0.97.8+1.20.5",
        12006: "0.100.0+1.20.6",
        12100: "0.100.7+1.21",
        12101: "0.110.0+1.21.1",
        12111: "0.140.0+1.21.11",
]

def loaderVersions = [
        11601: project.loader_version,
        11605: project.loader_version,
        12100: project.loader_version,
        12101: project.loader_version,
        12111: "0.18.3",
]

def getJavaVersion() {
    if (mcVersion >= 12006) {
        return JavaVersion.VERSION_21;
    } else if (mcVersion >= 11700) {
        return JavaVersion.VERSION_17;
    }
    return JavaVersion.VERSION_1_8;
}


repositories {
    mavenCentral()
    maven {
        name = "MiranCZRepo"
        url = "https://mirancz.github.io/maven/"
        artifactUrls("https://mirancz.github.io/maven/cabaletta/baritone-unoptimized/${project.name}")
    }
    maven {
        name = 'babbaj-repo'
        url = 'https://babbaj.github.io/maven/'
    }
    flatDir {
        dirs '../baritone/dist'
    }
}

jvmdg {
    downgradeTo = getJavaVersion()
}

dependencies {
    //to change the versions see the gradle.properties file
    minecraft("com.mojang:minecraft:${project.name}")
    mappings("net.fabricmc:yarn:${mappingsVersions[mcVersion]}:v2")
    modImplementation("net.fabricmc:fabric-loader:${loaderVersions.containsKey(mcVersion) ? loaderVersions[mcVersion] : project.loader_version}")
    include(implementation(annotationProcessor("io.github.llamalad7:mixinextras-fabric:0.3.5")))

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation("net.fabricmc.fabric-api:fabric-api:${fabricApiVersions[mcVersion]}")

    // Jackson JSON
    implementation 'com.fasterxml.jackson.core:jackson-core:2.16.0'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.16.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.16.0'

    // Jvm downgrader
    include('xyz.wagyourtail.jvmdowngrader:jvmdowngrader-java-api:0.9.0:downgraded-8')

    // Nether pathfinder
    implementation 'dev.babbaj:nether-pathfinder:1.5'

    // Unit tests (src/test is JUnit 5). Gradle 9 needs the platform launcher on the test runtime.
    testImplementation(platform('org.junit:junit-bom:5.10.2'))
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // PSA: Some older mods, compiled on Loom 0.2.1, might have outdated Maven POMs.
    // You may need to force-disable transitiveness on them.
    shadow('com.fasterxml.jackson.core:jackson-core:2.16.0')
    shadow('com.fasterxml.jackson.core:jackson-annotations:2.16.0')
    shadow('com.fasterxml.jackson.core:jackson-databind:2.16.0')

    // Thank you georgeagostino for fixing my garbage
    // Baritone/Ostinato: 1.16.1 requires the matching Ostinato artifact. The
    // 1.21.11 port can use its matching Ostinato artifact while it is developed;
    // do not load that artifact into 1.21 / 1.21.1 projects.
        def ostinatoDist = file("${rootProject.projectDir}/../Ostinato/dist")
        def ostinato1161Dist = file("${rootProject.projectDir}/../Ostinato-1.16.1/dist")
        // In-tree checkouts (CI stages jars here or under libs/).
        def ostinatoDistInTree = file("${rootProject.projectDir}/Ostinato/dist")
        def ostinato1161DistInTree = file("${rootProject.projectDir}/Ostinato-1.16.1/dist")
        def ostinatoLibs = file("${rootProject.projectDir}/libs")
        def ostinatoSearchDirs = [ostinatoDist, ostinato1161Dist, ostinatoDistInTree, ostinato1161DistInTree, ostinatoLibs]

        if (mcVersion == 11601) {
        // Prefer Ostinato 1.16.1 (AltoClef hooks + method_30621 no-op + drops guard).
        def jars1161 = []
        ostinatoSearchDirs.each { dir ->
            if (dir.exists()) {
                dir.eachFileMatch(~/baritone-unoptimized-fabric-.*1\.16\.1.*\.jar/) { f -> jars1161 << f }
                dir.eachFileMatch(~/baritone-unoptimized-fabric-ostinato-1\.16\.1\.jar/) { f -> jars1161 << f }
            }
        }
        jars1161 = jars1161.unique { it.absolutePath }.sort { -it.lastModified() }
        if (jars1161.isEmpty()) {
            throw new GradleException("Missing Ostinato 1.16.1 Baritone jar. Build Ostinato branch 1.16.1 or place baritone-unoptimized-fabric-ostinato-1.16.1.jar in ../Ostinato/dist (see docs/OSTINATO_WIRING.md).")
        }
        def jar = jars1161[0]
        println "[altoclef] Ostinato Baritone for ${project.name}: ${jar.name}"
        modImplementation files(jar)
        // NOTE: deliberately NOT `include files(jar)`.
        //
        // Loom's `processIncludeJars` resolves its `jarIds` property and rejects any
        // candidate that "is not a module component and has no capabilities":
        //   Attempted to nest artifact baritone-unoptimized-fabric-1.16.1.jar
        //   which is not a module component and has no capabilities.
        // A flat-file jar carries no capabilities (and `capabilities { }` is not
        // available on a FileCollectionDependency), so nesting it fails. This was
        // latent for a long time because the task stayed cached; it surfaced as soon as
        // the Ostinato jar was rebuilt and its bytes changed (cost 2 builds on
        // 2026-09-20, 16m45s + 15m15s).
        //
        // Baritone does not need to be nested into the altoclef jar for development or
        // for runClient: it is a normal runtime mod and is already staged as a Fabric
        // mod (fabric.mod.json present) alongside altoclef. If a bundled release jar is
        // ever required, do it as a separate packaging step with a Loom-produced
        // artifact, not by including a flat file here.
    } else {
        // Only 1.21.11 can use main's matching Ostinato artifact. 1.21 and 1.21.1
        // must resolve their matching Baritone artifact instead of a 1.21.11 jar.
        def ostinatoJars = []
        [ostinatoDist, ostinatoDistInTree].each { dir ->
            if (dir.exists()) {
                dir.eachFileMatch(~/baritone-unoptimized-fabric-.*\.jar/) { f ->
                    if (!f.name.contains("1.16.1") && !f.name.contains("ostinato-1.16")) {
                        ostinatoJars << f
                    }
                }
            }
        }
        ostinatoJars = ostinatoJars.unique { it.absolutePath }.sort { -it.lastModified() }
        if (ostinatoJars.isEmpty() && ostinatoLibs.exists()) {
            ostinatoLibs.eachFileMatch(~/baritone-unoptimized-fabric-ostinato.*\.jar/) { f ->
                if (!f.name.contains("1.16.1")) ostinatoJars << f
            }
            // Also accept any non-1.16.1 unoptimized fabric jar staged into libs/ by CI.
            if (ostinatoJars.isEmpty()) {
                ostinatoLibs.eachFileMatch(~/baritone-unoptimized-fabric-.*\.jar/) { f ->
                    if (!f.name.contains("1.16.1") && !f.name.contains("ostinato-1.16")) {
                        ostinatoJars << f
                    }
                }
            }
        }
        // 1.21.11 has no published cabaletta Baritone coordinate — Ostinato tip jar only.
        // Without the jar, skip the dep so OTHER modules can still configure/compile on a
        // clean tree; :1.21.11:compileJava itself will fail until the jar is staged.
        if (mcVersion == 12111 && !project.hasProperty("altoclef.forceMiranczBaritone")) {
            if (!ostinatoJars.isEmpty()) {
                def jar = ostinatoJars[0]
                println "[altoclef] Ostinato Baritone for ${project.name}: ${jar.name}"
                modImplementation files(jar)
                include files(jar)
            } else {
                println "[altoclef] Ostinato tip jar not found for ${project.name} — configure continues without Baritone (stage ../Ostinato/dist or libs/; see docs/DEVELOPMENT.md)"
            }
        } else {
            def baritoneMcVersion = project.name
            if (getProject().hasProperty("altoclef.development")) {
                // Must run build from baritone-plus once
                modImplementation "baritone-api-fabric:baritone-unoptimized-fabric-${baritoneMcVersion}"
                include "baritone-api-fabric:baritone-unoptimized-fabric-${baritoneMcVersion}"
            } else {
                modImplementation "cabaletta:baritone-unoptimized-fabric:${baritoneMcVersion}"
                include "cabaletta:baritone-unoptimized-fabric:${baritoneMcVersion}"
            }
        }
    }

    //modImplementation 'baritone-api-fabric:baritone-api-fabric:1.6.3'
    //implementation files('baritone-plus/build/libs/baritone-unoptimized-fabric-1.6.3.jar')

    // Tungsten physics A* (1.21.x tip + 1.16.1 parity). Optional: jar may be absent — facade falls back to Baritone.
    // Tip:     cd vendor/tungsten && ./gradlew remapJar
    // 1.16.1:  cd vendor/tungsten-1.16.1 && ./gradlew remapJar
    // Then copy matching tungsten-fabric-*.jar to libs/ (or leave in vendor build/libs).
    // COMPILE NOTE: do not run altoclef compileJava while runClient is live.
    if (mcVersion == 12111 || mcVersion == 12101 || mcVersion == 12100 || mcVersion == 11601) {
        def tungstenJars = []
        def libsDir = file("${rootProject.projectDir}/libs")
        def vendorLibsTip = file("${rootProject.projectDir}/vendor/tungsten/build/libs")
        def vendorLibs1161 = file("${rootProject.projectDir}/vendor/tungsten-1.16.1/build/libs")
        def vendorLibs = (mcVersion == 11601) ? vendorLibs1161 : vendorLibsTip
        def nameOk = { String n ->
            if (n.contains('sources') || n.contains('dev') || n.contains('javadoc')) return false
            if (mcVersion == 11601) return n.contains('1.16.1') || n.contains('1161')
            // tip: reject 1.16.1 jars
            return !n.contains('1.16.1') && !n.contains('1161')
        }
        if (libsDir.exists()) {
            libsDir.eachFileMatch(~/tungsten.*\.jar/) { f ->
                if (nameOk(f.name)) tungstenJars << f
            }
        }
        if (tungstenJars.isEmpty() && vendorLibs.exists()) {
            vendorLibs.eachFileMatch(~/tungsten.*\.jar/) { f ->
                if (nameOk(f.name)) tungstenJars << f
            }
        }
        tungstenJars = tungstenJars.unique { it.name }
        if (!tungstenJars.isEmpty()) {
            println "[altoclef] Tungsten jars for ${project.name}: ${tungstenJars*.name}"
            tungstenJars.each { jarFile ->
                modImplementation files(jarFile)
                // See the long note in the 1.16.1 Ostinato branch above: a flat-file jar
                // has no capabilities, so `include files(...)` makes Loom's
                // processIncludeJars fail with
                //   Attempted to nest artifact <name> which is not a module component
                //   and has no capabilities.
                // Tungsten, like Baritone, is loaded from the dev classpath at runtime,
                // so nesting is not required for build or runClient.
            }
        } else {
            println "[altoclef] Tungsten jar not found for ${project.name} — Baritone fallback (see docs/TUNGSTEN_BACKEND.md)"
        }
    }
}
shadowJar {
    configurations = [project.configurations.shadow]
}

remapJar {
    dependsOn("shadowJar")
    input.set(shadowJar.archiveFile)
}

downgradeJar {
    dependsOn("remapJar")
    inputFile.set(remapJar.archiveFile)
}

tasks.register('replaceJar') {
    // do not downgrade java version if we do not need to
    if (getJavaVersion() == java.targetCompatibility) {
        return
    }

    dependsOn downgradeJar
    doLast {
        def originalJar = tasks.remapJar.archiveFile.get().asFile
        def downgradedJar = file("${originalJar.parent}/${originalJar.name.replace('.jar', '-downgraded.jar')}")
        if (downgradedJar.exists()) {
            originalJar.delete()
            downgradedJar.renameTo(originalJar)
        } else {
            throw new GradleException("Downgraded JAR not found: ${downgradedJar}")
        }
    }
}


build {
    dependsOn tasks.replaceJar
}

processResources {
    inputs.property("version", project.version)
    inputs.property("mcVersion", project.name)

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "mcVersion": project.name
    }

    from(sourceSets.main.resources.srcDirs) {
        duplicatesStrategy DuplicatesStrategy.EXCLUDE
        exclude "fabric.mod.json"
    }
}

// ensure that the encoding is set to UTF-8, no matter what the system default is
// this fixes some edge cases with special characters not displaying correctly
// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}

test {
    useJUnitPlatform()
}

// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
// if it is present.
// If you remove this task, sources will not be generated.
task sourcesJar(type: Jar, dependsOn: classes) {
    from sourceSets.main.allSource
}

jar {
    from "LICENSE"
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            // add all the jars that should be included when publishing to maven
            artifact(remapJar) {
                builtBy remapJar
            }
            artifact(sourcesJar) {
                builtBy remapSourcesJar
            }
        }
    }

    // select the repositories you want to publish to
    repositories {
        // uncomment to publish to the local maven
        // mavenLocal()
    }
}
