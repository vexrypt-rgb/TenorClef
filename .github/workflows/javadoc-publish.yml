name: Deploy Javadoc

on:
  push:
    branches:
      - main

# Non-blocking: javadoc generation / pages deploy must not red the main branch.
# Root cause is often Gradle/Java mismatch or missing docs tree — fix later if needed.

jobs:
  publish:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Generate Javadoc
        id: javadoc
        continue-on-error: true
        run: |
          set -euo pipefail
          if ./gradlew javadoc --stacktrace; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::javadoc generation failed — deploy skipped (non-blocking)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
      - name: Deploy 🚀
        if: steps.javadoc.outputs.ok == 'true'
        continue-on-error: true
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/docs/javadoc
          branch: javadoc
          clean: true
          target-folder: javadoc
